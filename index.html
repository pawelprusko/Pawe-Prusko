<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Data Alchemist</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2C2C2C" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        background-color: #2C2C2C;
        margin: 0;
        padding: 0;
      }
      #splash-screen {
        position: fixed;
        inset: 0;
        background-color: #2C2C2C;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.6s ease-in-out, visibility 0.6s ease-in-out;
      }
      .splash-logo {
        width: 80px;
        height: 80px;
        position: relative;
        border-radius: 6px;
        overflow: hidden;
        display: flex;
        animation: splash-bounce 2s infinite cubic-bezier(0.28, 0.84, 0.42, 1);
      }
      .splash-logo-left {
        width: 50%;
        height: 100%;
        background: #5242C3;
      }
      .splash-logo-right {
        width: 50%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .splash-logo-tr {
        width: 100%;
        height: 50%;
        background: #816CFF;
      }
      .splash-logo-br {
        width: 100%;
        height: 50%;
        background: #B6ADFB;
      }
      @keyframes splash-bounce {
        0%, 100% {
          transform: translateY(0);
          animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
        }
        50% {
          transform: translateY(-25%);
          animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
        }
      }
      body.app-loaded #splash-screen {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="splash-logo">
        <div class="splash-logo-left"></div>
        <div class="splash-logo-right">
          <div class="splash-logo-tr"></div>
          <div class="splash-logo-br"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
  </body>
</html>
